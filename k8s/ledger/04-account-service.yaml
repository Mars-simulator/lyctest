# 账户服务（APP_ROLE=account）
# 账务服务通过 HTTP 调用它的 /internal/accounts/* 做归属与冻结校验，
# 因此必须先于账务服务就绪。这里作为账务服务的支撑服务一并部署。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: ledger
  labels:
    app: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: nest-typeorm-crud-account-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ROLE
              value: account
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: account-service
            - name: APP_VERSION
              value: 0.0.1
            - name: LOG_LEVEL
              value: info
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USERNAME
              value: root
            - name: DB_DATABASE
              value: nest_crud_demo
            # 账户服务先启动并完成建表（synchronize），账务服务随后复用同一套表
            - name: DB_SYNC
              value: "true"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-secret
                  key: JWT_SECRET
          ports:
            - name: http
              containerPort: 3001
          # /ready 会检查 DB 与 Redis；/health 仅确认进程存活
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: ledger
spec:
  type: ClusterIP
  selector:
    app: account-service
  ports:
    - name: http
      port: 3001
      targetPort: http
