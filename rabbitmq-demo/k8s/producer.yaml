apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    app: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: rabbitmq-demo-producer:v4
          imagePullPolicy: IfNotPresent
          env:
            # RabbitMQ 用 Docker 起在宿主机，Docker Desktop 的 K8s Pod 通过该域名访问宿主机
            - name: RABBITMQ_URL
              value: "amqp://host.docker.internal:5672"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  labels:
    app: producer
spec:
  type: NodePort
  selector:
    app: producer
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
